name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native deps
        run: pnpm rebuild esbuild
        continue-on-error: true

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node }}-
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo build --cache-dir=.turbo

      - name: Typecheck
        run: pnpm turbo typecheck --cache-dir=.turbo

      - name: Test
        run: pnpm turbo test --cache-dir=.turbo

      - name: Lint
        run: pnpm turbo lint --cache-dir=.turbo
        continue-on-error: true
